version: '3.8'

services:
  visual-service:
    build: .
    container_name: visual-service
    ports:
      - "8000:8000"
    environment:
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=http://localhost:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=visual-storage
      - S3_REGION=us-east-1
      - S3_USE_SSL=False
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEBUG=False
      - LOG_LEVEL=INFO
    depends_on:
      - minio
    restart: unless-stopped
    networks:
      - visual-network

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - visual-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  createbuckets:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/visual-storage --ignore-existing;
      /usr/bin/mc anonymous set download myminio/visual-storage;
      echo 'Bucket setup complete';
      exit 0;
      "
    networks:
      - visual-network

volumes:
  minio_data:
    driver: local

networks:
  visual-network:
    driver: bridge
