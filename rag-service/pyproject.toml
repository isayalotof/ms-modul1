[project]
name = "rag-service"
version = "1.0.0"
description = "RAG Microservice with PostgreSQL and pgvector"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "anthropic>=0.39.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "sentence-transformers>=2.2.0",
    "torch>=2.1.0",
    "transformers>=4.35.0",
    "pypdf2>=3.0.0",
    "python-docx>=1.1.0",
    "aiofiles>=23.2.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
